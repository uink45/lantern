name: GitHub Runner Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref to build'
        required: true
        type: string
        default: 'devnet-5'
      image_tag:
        description: 'Local image tag stored in the artifact'
        required: true
        type: string
        default: 'lantern-gh-nocache'

jobs:
  build-amd64-tar:
    name: Build amd64 Docker Image Tar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          submodules: recursive

      - name: Capture source metadata
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.inputs.source_ref }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: lantern:${{ github.event.inputs.image_tag }}
          outputs: type=docker,dest=/tmp/lantern-image.tar
          build-args: |
            GIT_COMMIT=${{ steps.source.outputs.sha }}
            GIT_BRANCH=${{ steps.source.outputs.ref }}
            LANTERN_RUST_PROFILE=0
            LANTERN_FORCE_REBUILD=1

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-image-${{ github.event.inputs.image_tag }}
          path: /tmp/lantern-image.tar
          if-no-files-found: error
          compression-level: 0
